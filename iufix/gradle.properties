mod_description=Industrial Upgrade 3.4.0.10 bug fixes: all IU machine blocks harvestable with iron-or-better pickaxe (canHarvestBlock rewritten; wood/stone pickaxe, other tools and bare hands cannot harvest, wrench path untouched), all null-tank dereferences in ComponentProcess guarded, apiary flower render null guarded after reload, BlockFluidIU drain implemented (1000mb + clear source), Scanner/VeinSensor right-click guard on empty pattern map/vector, pollution debuffs (slowness/mining fatigue/weakness/nausea/blindness/poison gas) disabled while pollution values, visuals and terrain effects keep running. 1.4.0: multiblock proxy layer rewritten in IE mode (relative-offset NBT relX/relY/relZ with dual-track read of legacy absolute masterX/Y/Z, load-time health check, setMasterPos target validation without setChanged re-entry, full-dimension refresh cleanup, /iufix cleanmultiblock command). 1.4.1: proxy mixin rewritten without extends (mixin 0.8.5 rejects a mixin extending the target class itself - SubType$Standard.validate "Super class ... was not found in the hierarchy of target class" - so the 1.4.0 proxy layer never applied), plus worldgen/village anvil ghost fix: ChunkEvent.Load (server, new chunks only) schedules a next-tick MultiCellCollisionManager.refresh for every needCollision BlockEntityBase, replicating the onLoad path that the LevelChunk ProtoChunk-transfer skips.
