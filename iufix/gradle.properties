mod_description=Industrial Upgrade 3.4.0.10 bug fixes: 1.9.4 - molecular transformer cache-null write instrumentation: MolecularTransformerCacheTraceMixin logs the full caller stack (side/thread name/BE pos, throttled) whenever setRecipeOutput(i, null) writes a null into output[i] - the exact moment the 11:01 race-null was produced - so the sync path that clears the cache mid-frame can be identified; the 1.9.3 guard's intercept log now also prints the caught exception's full stack trace and both render/current thread names. 1.9.3 - molecular transformer GUI render NPE guard v2 (crash-2026-09-05_11.01.41-client.txt): the 1.9.2 cache-fallback redirect proved insufficient because the client BE's slot/cache sync races the render frame mid-branch (the 11:01 crash shows the cached output[i] was concurrently nulled by setRecipeOutput(null) between the branch guard and the redirect handler, so the handler itself returned null and the caller dereferenced it). v2: m_7286_ is now @Overwrite'd with an equivalent copy of the original body (super renderBg -> renderBackground, protected ScreenIndustrialUpgrade.draw inlined as drawString, guiLeft/top -> getGuiLeft/getGuiTop) wrapped entirely in try/catch(Throwable) - any exception (including the race NPE) is intercepted, throttled diagnostic dump logged (input slot/cached recipe/per-slot snapshot/global recipe table), and the frame simply skips the rest of the draws; drawForegroundLayer keeps the original method but gets two race-closing @Redirects: GETFIELD output returns a null-free copy (null elements swapped for a lazily-built dummy MachineRecipe) and the getOutput invoke returns cached or the dummy instead of null. 1.9.2 - molecular transformer GUI render NPE guard (crash-2026-09-05_09.49.29-client.txt): ScreenMolecularTransformer's queue/x64 branches dereference getOutput(i).getRecipe() with no null check; getOutput runs a fresh recipe lookup (inputSlot[i].process()) and legally returns null when nothing matches (BE-side callers all null-check), so during queue-mode automation the render thread hit NPE and the game emergency-saved and quit. Fix: @Redirect all 5 getOutput call sites (m_7286_ x1 + drawForegroundLayer x4, require=1 each); handler reads the cached recipe (getRecipeOutput(i)) BEFORE calling the original (which overwrites it), and on null logs full diagnostics (input slot item/NBT, cached recipe, per-slot recipe_list snapshot, global molecular recipe table, throttled 5s per signature) then falls back to the cached value - guaranteed non-null because the branch guard continue_proccess just checked the same cache, so rendering never crashes and shows the recipe the machine is actually running. 1.7.0 - IU cool-temperature gameplay master switch: config/iufix.json key cooling (bool, default true = vanilla behavior; false kills the entire heat-dissipation requirement - every cooled sink machine (multi-machine family + fluid refrigerator) stays at 0C and never stops/hangs from temperature). Implementation: config value (read at mod constructor, default file generated) is written into IU's dormant built-in CoolComponent.cooling static switch (addEnergy zeroes cold storage when false, but only for ICoolSink delegates); IUCoolComponentMixin adds two injections (addEnergy/readFromNbt TAIL, require=1, one-shot probe warn) that zero cold storage for sink components (sinkDirections non-empty) because readFromNbt reloads a persisted 100C before delegates exist, and the stop gates (ProcessMultiComponent temperature>=capacity -> idle; fillRatio>=1 -> Integer.MAX_VALUE operation length) read storage before any addEnergy - both paths covered; cooling=true is a total no-op (vanilla-identical). Cooler sources and reactor coolant blocks keep working untouched. 1.6.1 - all IU machine blocks harvestable with ANY pickaxe or paxel (minecraft:pickaxes OR forge:tools/paxels tag suffices; canHarvestBlock fully rewritten, wooden/stone pickaxe, GT/AE2 pickaxes, IC2 drills and mysticalagradditions paxels all ok, TieredItem/tier gate removed per user ruling; full-machine drop chain verified 100% on pickaxe path; one-shot probe warn logged on first canHarvestBlock call, per-injector require=1). Earlier: Wrench-harvest class wrote no drop because the Wrench branch checks a nonexistent minecraft:wrench tag (canHarvestBlock rewritten; wood/stone pickaxe, other tools and bare hands cannot harvest, wrench path untouched), all null-tank dereferences in ComponentProcess guarded, apiary flower render null guarded after reload, BlockFluidIU drain implemented (1000mb + clear source), Scanner/VeinSensor right-click guard on empty pattern map/vector, pollution debuffs (slowness/mining fatigue/weakness/nausea/blindness/poison gas) disabled while pollution values, visuals and terrain effects keep running. 1.4.0: multiblock proxy layer rewritten in IE mode (relative-offset NBT relX/relY/relZ with dual-track read of legacy absolute masterX/Y/Z, load-time health check, setMasterPos target validation without setChanged re-entry, full-dimension refresh cleanup, /iufix cleanmultiblock command). 1.4.1: proxy mixin rewritten without extends (mixin 0.8.5 rejects a mixin extending the target class itself - SubType$Standard.validate "Super class ... was not found in the hierarchy of target class" - so the 1.4.0 proxy layer never applied), plus worldgen/village anvil ghost fix: ChunkEvent.Load (server, new chunks only) schedules a next-tick MultiCellCollisionManager.refresh for every needCollision BlockEntityBase, replicating the onLoad path that the LevelChunk ProtoChunk-transfer skips. 1.4.2: village anvil orientation fix - prebaked jigsaw house templates rotate the whole house but BlockTileEntity never rotated its "facing" state property and BlockEntityBase.readFromNBT always read the baked NBT facing, so collision proxies (and the anvil row) ended up perpendicular to and embedded in the rotated wall. Fix: BlockStateBase.rotate/mirror (m_60717_/m_60715_) now rotate the facing property of BlockTileEntity-family states (mixin 0.8.5 cannot inject inherited methods - InjectionInfo.findRootTargets only scans declared methods - so the inject sits on the declaring class plus an instanceof filter), and readFromNBT now overrides BE facing with the (already rotated) block state facing. Proxies land on the rotated cell row, parallel to the rotated wall, all in air. 1.4.3-hotfix6: guide book quest description text now wraps correctly - IU's splitTextToLines only broke lines on spaces, so no-space CJK (Chinese) paragraphs rendered as a single over-wide line clipped by the scissor; the method is overwritten with an equivalent greedy wrap plus a character-level width fallback for over-wide words (font.width-based, English/other space-separated text behavior unchanged). 1.4.3-hotfix7: new players no longer auto-receive the starting guide book (iu:guide_book) and vein sensor (iu:sensor) on first world entry - both items already have crafting recipes, and the login grant is redundant. Fix redirects both Player.addItem (m_36356_) call sites in IUCore.loginPlayer and swallows only those two items; the rest of loginPlayer (guide quest map load, vein/relocator packet sync, radiation init) is untouched. 1.8.0 - QoL ruling: BlockBaseMachine3Entity.getDefaultDrop() always returns Self (enum mixin, HEAD, require=1), so every basemachine3 machine mined with a pickaxe drops the full machine + component NBT (was: DefaultDrop.Machine machines like the rocket assembler drop a basic machine casing - "mine A get B"; multi-cell machines' masters are sealed behind BlockCollisionProxy cells where the wrench cannot reach, so the full machine was unobtainable there). Wrench removal becomes optional; bonus: BlockEntityElectricBlock.adjustDrop's wrench||Self gate now writes retained energy (80%) into pickaxe-mined electric storage machines. Casings (blockResource machine/advanced_machine) remain craftable per user. 1.9.0 - AE2 automation fix for the four space assemblers (probe/rocket/satellite/rover): their require=true index-strict recipes need one item per slot, but the Forge capability path (SidedInvWrapper slotLimit -> Container.getMaxStackSize -> BlockEntityInventory.getInventoryStackLimit hardcoded 64) ignored the per-slot limit of 1 that only the GUI respected, so AE2 stacked 64 into the first valid slot and the recipe never matched. Fix: getMaxStackSize returns 1 for exactly those four machines (single mixin on the shared parent + instanceof filter, require=1), making the automation path distribute one item per allowed slot (canPlaceItem keeps index correctness); output slots also limit to 1 but machine output uses Inventory.add (limit-agnostic) and extractors loop fine; all four machines' recipes are single-stack-per-slot (verified), nothing starves. 1.9.1 - crash fix: the injection string must use the runtime SRG name m_6893_ (getMaxStackSize is a vanilla WorldlyContainer override, IU ships it SRG-named; 1.9.0's official-name selector failed at APPLY with InvalidInjectionException, crash-2026-09-03_19.00.40-fml.txt, javap-verified runtime method public int m_6893_() delegating to getInventoryStackLimit).
