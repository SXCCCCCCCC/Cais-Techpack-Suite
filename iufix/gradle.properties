mod_description=Industrial Upgrade 3.4.0.10 bug fixes: all IU machine blocks harvestable with iron-or-better pickaxe (canHarvestBlock rewritten; wood/stone pickaxe, other tools and bare hands cannot harvest, wrench path untouched), all null-tank dereferences in ComponentProcess guarded, apiary flower render null guarded after reload, BlockFluidIU drain implemented (1000mb + clear source), Scanner/VeinSensor right-click guard on empty pattern map/vector, pollution debuffs (slowness/mining fatigue/weakness/nausea/blindness/poison gas) disabled while pollution values, visuals and terrain effects keep running. 1.4.0: multiblock proxy layer rewritten in IE mode (relative-offset NBT relX/relY/relZ with dual-track read of legacy absolute masterX/Y/Z, load-time health check, setMasterPos target validation without setChanged re-entry, full-dimension refresh cleanup, /iufix cleanmultiblock command). 1.4.1: proxy mixin rewritten without extends (mixin 0.8.5 rejects a mixin extending the target class itself - SubType$Standard.validate "Super class ... was not found in the hierarchy of target class" - so the 1.4.0 proxy layer never applied), plus worldgen/village anvil ghost fix: ChunkEvent.Load (server, new chunks only) schedules a next-tick MultiCellCollisionManager.refresh for every needCollision BlockEntityBase, replicating the onLoad path that the LevelChunk ProtoChunk-transfer skips. 1.4.2: village anvil orientation fix - prebaked jigsaw house templates rotate the whole house but BlockTileEntity never rotated its "facing" state property and BlockEntityBase.readFromNBT always read the baked NBT facing, so collision proxies (and the anvil row) ended up perpendicular to and embedded in the rotated wall. Fix: BlockStateBase.rotate/mirror (m_60717_/m_60715_) now rotate the facing property of BlockTileEntity-family states (mixin 0.8.5 cannot inject inherited methods - InjectionInfo.findRootTargets only scans declared methods - so the inject sits on the declaring class plus an instanceof filter), and readFromNBT now overrides BE facing with the (already rotated) block state facing. Proxies land on the rotated cell row, parallel to the rotated wall, all in air.
