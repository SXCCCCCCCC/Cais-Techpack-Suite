mod_description=Industrial Upgrade 1.20.1 recipe machines 5x speed: constructor mixins divide operation time by a configurable multiplier (default 5; config/iuspeed-common.toml speed_multiplier, 1 = off). v1.1: multiblock Smeltery (furnace/casting, ComponentProgress maxValue=108) and AutoCrafter (100) via ProgressLengthMachineMixin. v1.2.6: silicon crystal growers (Primal 3min -> 36s, GUI 45s -> 9s) by DIRECT duration replacement, not rate scaling: SiliconCrystalTimerMixin injects at each grower machine's own single ctor (BlockPos, BlockState) RETURN and rewrites the already-constructed Timer (hour/minute/seconds + max) of BOTH ComponentTimer lists (timers AND defaultTimers - resetTime() copies the defaults back, so both must be written) to total/5 via the TimerDurationAccessor interface mixin whose setters Mixin generates inside the Timer class (per-ctor one-shot, never at runtime; percent stays 1.0; energy per tick unchanged; the other ComponentTimer users - solar panels, lightning rod, moon spotter etc. - are untouched, Timer only gains inert setters; level speed semantics unaffected). GUI machine's timer is an anonymous ComponentTimer subclass: the shared Timer instances are rewritten, level speed semantics unaffected. The v1.2.5 rate-approach is removed (it shipped a @Shadow without remap=false - Mixin 0.8.5 MixinInfo$State.validateRemappable rejects remappable @Shadow with InvalidMixinException at post-initialise, the mixin is silently discarded, no acceleration and no crash). defaultRequire=1 so failed injections crash loudly. Family 1: five operation components. Family 2: 45 standalone time-field recipe machines. v1.3.0: BLAST FURNACE (BlockEntityBlastFurnaceMain, not a recipe machine - hardcoded state machine accumulating progress += 1 + 0.25*(bar-1) per server tick against a hardcoded progress >= 3600 literal, source lines 476/478) is sped up by rewriting that duration literal via core-Mixin @ModifyConstant (ModifyConstantInjector extends RedirectInjector; handler signature is (double)double with NO receiver - 0.8.5 invokeConstantHandler validateParams expected params = exactly [constantType], runtime-jar disassembly + runtime crash cross-verified; the pre-1.3.3 "(Owner, double)double" signature was wrong and blew up at APPLY with InvalidInjectionException (crash-2026-08-31_22.29.03-fml.txt), fixed in 1.3.3; no synthetic classes, not MixinExtras) to 3600/mult (default: 720 ticks -> 36s at bar=1, was 180s; energy/steam per tick unchanged, total per heat 5x less; bar 1..5 speed tiers preserved). Second injection in the same mixin scales getProgress() (self-declared, (CallbackInfoReturnable)V per the no-receiver rule, and cancellable=true because the handler calls setReturnValue - an @Inject that calls setReturnValue MUST declare cancellable=true or 0.8.5 throws CancellationException at render time, crash-2026-08-31_22.58.08-client.txt, fixed in 1.3.4; the only CallbackInfoReturnable/setReturnValue use point in the whole mod) by mult so the client progress bar (ScreenBlastFurnace divides getProgress() by hardcoded 3600D twice) still fills to 100% during the shortened run; the client-only screen class itself is deliberately NOT targeted (safe for dedicated servers). Companion BEs (input/output/fluid/heat/other-part) have no progress fields (package-wide grep verified). v1.3.2: ELECTRIC PROGRAMMING TABLE ("programming table" - BlockEntityProgrammingTable, runtime kubejs-export id industrialupgrade:basemachine3/programming_table; item/block/block_entity_type all three registered there, enum BlockBaseMachine3Entity.programming_table(BlockEntityProgrammingTable.class, 183)) is verified a PURE TIMER machine - ctor new ComponentTimer(this, new Timer(0,2,0)) (source line 57; runtime 3.4.0.10 bytecode iconst_0/iconst_2/iconst_0 + anonymous $1 subclass confirmed) = 2 min 2400 ticks per craft, done-check getTimers().get(0).getTime() <= 0 (line 185); the "click mini-game" prior conclusion was misattributed - that is the PRIMAL variant BlockEntityPrimalProgrammingTable (ComponentProgress 300 + color-strip clicks, id industrialupgrade:primal_programming_table/primal_programming_table), left untouched. ProgrammingTableTimerMixin takes the same silicon route: single ctor RETURN + TimerDurationAccessor rewrite both Timer lists' four fields (hour/minute/seconds/max) to total/5 (120s -> 24s, 480 ticks at level 0; energy 2 EU/t per tick unchanged, per-craft total /5); levelBlock upgrades (getTickFromSecond = 20 - level*1.75, used via ComponentTimer.updateEntityServer gameTime % getTickFromSecond) stack untouched; the old soldering-table fix (wrong machine, user-confirmed) is reverted, no PrimalSolderingDurationMixin exists. v1.4.0 (user ruling: ALL machines) audits and accelerates every remaining time-based machine: TimerMachinesMixin adds AlkalineEarthQuarry (Timer 15s->3s), GraphiteHandler (90s->18s), MatterFactory (60s->12s), MoonSpotter (20s->4s) via the same dual-Timer-list TimerDurationAccessor rewrite (their anonymous getTickFromSecond level upgrades stack untouched); standalone family adds BaseGenStone / BaseObsidianGenerator (abstract parents covering the stone/expanded/obsidian generators) + Pump + CombinedPump + PrimalFluidHeater (all self-declared operationLength, auto progress>=operationLength loops, energy per tick unchanged); BlockEntityBaseAdditionGenStone has TWO ctors (this() chain) so it gets its own AdditionGenStoneDurationMixin pinned to the 7-arg ctor descriptor to avoid double scaling through this(); BlockEntitySteamPump differs fundamentally - its ComponentProgress maxValue was written once at ctor (25) and has NO setUpgradestat/NO raw-progress redrive point, so field-scaling alone does nothing: SteamPumpDurationMixin calls both scale() and scaleProgress() (25->5). ProgressLengthMachineMixin adds NightConverter (80->16, getBar()>=1 tolerant), SoilAnalyzer (400->80, one-shot analyzed=true), QuantumMiner (1000->200, getBar()==1 exact equality is safe - progress is not NBT-persisted, chunk reload zeroes it, and int<=32767 divides exactly in IEEE double; 62.5 QE/t gate unchanged). NOT touched (semantic phase/weather machines, awaiting separate user verdict): SolarPanel 8h/4h/4h, MiniPanels 3h/2h30/2h phase cycles, LightningRodController 5min strike cooldown. NOT touched (player-driven, not time): PrimalPump (sneak-click +4/click vs 25), Primal mini-games (Primal programming table / soldering / electronics assembler). v1.4.1 (user ruling): electric programming table decoupled from speed_multiplier and hard-fixed at 25x (120s -> 4.8s, 96 ticks at level 0; cannot take upgrade modules, so standalone multiplier). v1.5.0 (user ruling: space system 10x): the space mission timers - FakePlanet/FakeSatellite/FakeAsteroid research/mining missions (timerTo/timerFrom, base 12*60*0.5 = 6min per distance ratio + 1h per solar distance, engine module and rocket fuel modifiers stack BEFORE our scaling) and Sends colony transports (16.66*60*0.8 = 13.3min per distance ratio, colony level dop divisor) - are divided by a fixed 10 (hardcoded, decoupled from speed_multiplier) via constructor RETURN injection on ALL constructors (fresh missions AND NBT-loaded in-flight missions get scaled, so existing slow missions speed up too) using the proven TimerDurationAccessor four-field rewrite (hour/minute/seconds/max; GUI progress bars read getBar() = time/max so they stay consistent). User asked about @ModifyVariable (needs ordinal counting and misses the NBT ctor) and @Redirect (targets the Timer constructor - project red line) - both rejected; energy per tick unchanged (space energy chain is per-tick in FakeSpaceSystemBase.manageEnergy).
