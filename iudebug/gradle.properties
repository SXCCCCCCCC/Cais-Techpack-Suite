mod_description=Industrial Upgrade 3.4.0.10 destructive debug tool: registration-phase cancellation of IU items/blocks/fluids/block-entity-types etc. driven by config/iudebug-common.toml banned_registrations list (namespace:path format, default empty = no-op). v1.2.0: molecular transformer init() is @Overwritten to be fully config-driven - config/iudebug-common.toml [molecular] recipes list, one line per recipe in "input*count|output*count|energy" format (# prefix = tag input; parse errors crash loudly). Defaults reproduce all 30 vanilla recipes with the core upgrade chain changed 4:1 -> 3:1 (user ruling 2026-09-04: 4^13=67M iridium was ~30h AFK per top core; 3^13=1.59M) and plutonium input directly ic2_120:plutonium (OEI-unified). First mixin in this mod (1.1.x was pure event+reflection).
