mod_description=Replaces the manual MaFgLib jar patch with runtime mixins: (1) InitializationHandler.handlers becomes a CopyOnWriteArrayList so concurrent handlers.add() from Forge parallel mod loading (ForkJoinPool) cannot corrupt the ArrayList internal array (ArrayIndexOutOfBounds / NPE while iterating in onGameInitDone); (2) ConfigManager loads configs on registerConfigHandler so feature callbacks constructed during registerModHandlers see real config values (fixes Tweakerge gamma override not applying after restart).
