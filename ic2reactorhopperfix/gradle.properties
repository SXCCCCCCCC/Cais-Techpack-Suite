mod_description=Fixes IC2 EU nuclear reactor chamber / access hatch item storage being broken for modded logistics (Sophisticated Storage hopper upgrade, Create chute) under Sinytra Connector: the chamber/hatch exposed a storage whose transaction snapshots are no-ops, so simulate-then-insert hoppers left phantom items and lost/duplicated items. Redirects the chamber/hatch item storage lookup to the reactor's RoutedItemStorage.
