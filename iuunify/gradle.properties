mod_description=IU (Industrial Upgrade 3.4.0.10) x IC2 Refabricated fluid unification phase 2-C: input-side tag-ification. Tag definitions: 12 IC2R fluids (ic2_120:*, +mekanism:steam synonym) published under forge:/c: namespaces (data/forge|data/c, replace:false merge with IC2 jar's own tags). Two mixins widen only input-tank acceptance: Fluids.addTank(InternalFluidTank) TAIL registers (tank -> owner BE -> rule table: 19 steam machines + coke oven input x2 + blast furnace steam, BioGenerator/SteamBioGenerator/BioFuelGenerator biomass, MultiCrop pestTank/FieldCleaner weed_ex, CyclotronCoolant/SteamTurbineCoolant coolant, GeothermalExchanger hot_coolant, BaseHeatMachine/SmelteryFuelTank pahoehoe_lava, SingleFluidAdapter distilled_water); InternalFluidTank.acceptsFluid(Fluid) HEAD lets forge:-tagged fluids in, else falls through to the exact-id predicate (output/judgement sides untouched, still IC2-exact via phase-1 redirect). Version 0.1.0 content retained: FluidName.getInstance() redirect for 12 fluids + DeferredRegister phase guard; pairs with iudebug banned_registrations.
