mod_description=IU (Industrial Upgrade 3.4.0.10) x IC2 Refabricated fluid unification. Phase 1: FluidName.getInstance() redirect for 12 fluids to ic2_120 (registration-phase guarded). Phase 2B: IuUnifyTransformPlugin rewrites checkcast IUFluid + follow-up invokevirtual to FlowingFluid (worldgen fluid = IC2 pahoehoe_lava source block); IUCoreRegisterItemTabMixin guards RegistryObject.get() with isPresent(). Phase 2C: input-side tag-ification via tank-system chokepoints (Fluids.addTank TAIL + InternalFluidTank.acceptsFluid HEAD) with InputTagRegistry rule table; 23 tag JSONs (11 unified fluids x forge:+c: namespaces, steam tag includes mekanism:steam). Phase 0.3.4: item-side fabric->Forge fluid capability bridge (TransferApiForgeCompatItemBridgeMixin + FluidStorageItemBridge, fix UI bucket/cell slot rejection), slot-level tag widening (InventoryFluidByList/InventoryTank acceptsLiquid), recipe 1494 override (crafting_240_element cells -> ic2_120:uu_matter). Phase 0.3.5: creosote rollback (tag JSONs back to IC2R-only; gas_combiner rule, RecipesFluidCoreMatchMixin, FluidHandlerRecipeConsumeMixin removed - creosote tag membership pending user adjudication), recipe 1119 override (crafting_155_element cells -> ic2_120:coolant). Phase 0.3.6: creosote re-tagged per kubejs export 4-family list (forge:/c: creosote += immersiveengineering:creosote/_flowing, thermal:creosote/_flowing, gtceu:creosote/flowing_creosote, idempotent with fluid_unify.js runtime adds), gas_combiner creosote rule + RecipesFluidCoreMatchMixin + FluidHandlerRecipeConsumeMixin restored from 0.3.4 (design kept, evidence corrected). Phase 0.3.7: fix creosote non-effect - non-empty tank anti-mix blockade. FluidTankFillUnifiedMixin widens ForgeFluidTank.fill's 2x anti-mix isFluidEqual (simulate offset 51 / real offset 129) with unified-tag check; InventoryFluidTransferDrainMixin redirects transferToTank's slot-side drain to drain by the slot item's own fluid when it shares a unified tag with the tank fluid (requested-fluid filter was rejecting cross-mod same-family items). Both target non-empty tank paths; empty-tank paths untouched. Phase 0.3.8: drop datapack recipe overrides (data/industrialupgrade/recipes/industrialupgrade_1494.json + _1119.json removed - never took effect, same-pack_priority earlier mod wins the path) - 1494/1119 cell recipes are now unified via KubeJS (remove + custom re-add with ic2_120:uu_matter / ic2_120:coolant NBT, ids kubejs:iu_cell_1494 / kubejs:iu_cell_1119). Phase 0.4.0 (A plan): item input-side tag widening - crystal handler silicon dust. ItemInputRegistry rule table (base item -> forge tag, first rule: industrialupgrade:itemdust/silicon_dust -> forge:dusts/silicon, members per kubejs export: gtceu:silicon_dust + IU, OEI rule kubejs/data/oei/replacements/silicon_dust.json: IU -> GT). Three mixins (remap=false, require=1): RecipeInputStackMatchedMixin HEAD on matched(ItemStack)Z (slot acceptance chokepoint: InventoryRecipes.canPlaceItem -> RecipeArrayList.contains), ItemInputStackMatchMixin HEAD on InputItemStack.matches(ItemStack)Z (recipe predicate chokepoint: RecipesCore.getRecipeMachineRecipeOutput require branch :1327), PrimalSiliconCrystalHandlerActivateMixin HEAD on BlockEntityPrimalSiliconCrystalHandler.onActivated (replicates lines 121-143 insert semantics, cap 3, shrink, server getOutput; field visibility javap: inputSlotA public final in target, outputSlot public in BlockEntityElectricMachine, no @Shadow). Both crystal handler machines (primal right-click + basemachine3 GUI, shared silicon_recipe) fixed; no recipe-object rewrite; tag already present, no new datapack; non-rule inputs byte-identical. Phase 0.3.9: full fluid-tag unification (per user adjudication: acids 6, methanol/ammonia/nitric_oxide/acetic_acid/cyclohexane/propane/propene, aromatic/olefin family, oil family, gases/halogens, honey). InputTagRegistry widens to a per-tank tag ARRAY (one slot may consume several unified families, e.g. gas_combiner/fluid_mixer/oil-refinery), InternalFluidTankAcceptMixin loops the array; rule table covers GasCombiner both tanks, FluidMixer both tanks, Electrolyzer, PrimalGasChamber both tanks, FluidSeparator, OilRefiner/ImpOilRefiner/OilPurifier, Dryer, Polymerizer. IU members of forge tags are added via KubeJS remove_recipes.js (shell-side); no other mixin changed. Phase 0.4.1: fluid-tag acceptance gap fix after user field test (furnace + GT nitric / Mek HF both rejected at tank accept). Root cause: the audit list only covered FluidHandlerRecipe-family machines; the ELECTRIC-REFRACTORY-FURNACE family (InventoryRecipes item-recipe-fluid machinery, base tank id "fluidTank") was missing from RULES, and the same family-by-family re-audit found 8 more in-scope fluid consumers missed: PlasticCreator, PlasticPlateCreator, FluidIntegrator, PrimalFluidIntegrator, SolidFluidMixer, SolidFluidIntegrator (both input tanks), FluidAdapter, PetrolGenerator, DieselGenerator. New InputTagRegistry constants seed_oil/helium/glowstone; RULES += 11 entries (per-machine concrete-owner rules, tank ids verified in desktop source); no mixin changes; no KubeJS changes (all referenced tags already carry IU members).