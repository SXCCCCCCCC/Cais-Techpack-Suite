mod_description=IU (Industrial Upgrade 3.4.0.10) x IC2 Refabricated fluid unification. Phase 1: FluidName.getInstance() redirect for 12 fluids to ic2_120 (registration-phase guarded). Phase 2B: IuUnifyTransformPlugin rewrites checkcast IUFluid + follow-up invokevirtual to FlowingFluid (ClientProxy.onClientSetup, GeneratorVolcano x3, SpaceMaterialSet x2, SpaceVolcanoPlacementLogic, SpaceRegionalHydrologyFeature, SpaceBodyDefinitionRegistry - worldgen fluid = IC2 pahoehoe_lava source block); IUCoreRegisterItemTabMixin guards RegistryObject.get() with isPresent(). Phase 2C: input-side tag-ification via tank-system chokepoints (Fluids.addTank TAIL + InternalFluidTank.acceptsFluid HEAD) with 33-rule InputTagRegistry; 24 tag JSONs (12 fluids x forge:+c: namespaces, steam tag includes mekanism:steam).
