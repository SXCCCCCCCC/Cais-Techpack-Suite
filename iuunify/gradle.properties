mod_description=IU (Industrial Upgrade 3.4.0.10) x IC2 Refabricated fluid unification. Phase 1: FluidName.getInstance() redirect for 12 fluids to ic2_120 (registration-phase guarded). Phase 2B: IuUnifyTransformPlugin rewrites checkcast IUFluid + follow-up invokevirtual to FlowingFluid (worldgen fluid = IC2 pahoehoe_lava source block); IUCoreRegisterItemTabMixin guards RegistryObject.get() with isPresent(). Phase 2C: input-side tag-ification via tank-system chokepoints (Fluids.addTank TAIL + InternalFluidTank.acceptsFluid HEAD) with InputTagRegistry rule table; 23 tag JSONs (11 unified fluids x forge:+c: namespaces, steam tag includes mekanism:steam). Phase 0.3.4: item-side fabric->Forge fluid capability bridge (TransferApiForgeCompatItemBridgeMixin + FluidStorageItemBridge, fix UI bucket/cell slot rejection), slot-level tag widening (InventoryFluidByList/InventoryTank acceptsLiquid), recipe 1494 override (crafting_240_element cells -> ic2_120:uu_matter). Phase 0.3.5: creosote rollback (tag JSONs back to IC2R-only; gas_combiner rule, RecipesFluidCoreMatchMixin, FluidHandlerRecipeConsumeMixin removed - creosote tag membership pending user adjudication), recipe 1119 override (crafting_155_element cells -> ic2_120:coolant).