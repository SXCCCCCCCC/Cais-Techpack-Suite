mod_description=1.20.1-Tec pack design decision (simplified GT): disables all GregTech CEu Modern explosion/damage mechanisms - overvoltage explosions (NotifiableEnergyContainer.acceptEnergyFromNetwork covering electric single blocks/EnergyHatch/Converter, BatteryBuffer$EnergyBatteryTrait), small boiler dry-burn refill explosion (SteamBoilerMachine), large boiler water deficit explosion + chain explosions (LargeBoilerMachine), Creative Energy Container delayed explosion (updateEnergyTick flag), and the full fluid pipe damage chain (FluidPipeBlockEntity.checkAndDestroy: burning/leaking/corroding/shattering/melting + small explosions + fire + heat/frost/chemical damage). Normal machine logic (boiler temperature control, steam output reduction, energy/fluid transfer) is preserved. Turbine rotor wear/contact damage intentionally untouched.
