mod_description=1.20.1-Tec pack JEI crash fix. GTCEu 7.5.3 multiblock info page (gtceu:multiblock_info, e.g. electric_blast_furnace) errored out with IndexOutOfBoundsException when hovered: MultiblockInfoCategory$1ProxyRecipeWidget.getSlotUnderMouse parses each JEI slot name ("slot_<i>", i = flat widget index baked at layout build by LDLib ModularUIRecipeCategory.setRecipe) back into an index of modularUI.getFlatWidgetCollection() at render time, but PatternPreviewWidget's widget tree mutates (scene-click candidate slots added/removed via onPosSelected, part slots rebuilt via setPage), so baked indices go stale and ArrayList.get throws. Fix keeps the original 7.5.3 semantics (panel guard + position sync + isMouseOver hit-test) and replaces only the fragile index lookup with order-based mapping (val$slots[i] <-> i-th IRecipeIngredientSlot widget in the flat list). Upstream 8.x's findFirst approach (return first slot unconditionally) was tried first and rejected in-pack: JEI's ingredient interaction pipeline keys off getSlotUnderMouse and consumed all mouse events on the page, killing the 3D scene rotate/zoom/click interactions (LDLib guiEventListener receives nothing).
