mod_description=Fixes server crash where IE spawn interdiction devices (Powered Lantern etc.) cancel a conversion-type spawn (e.g. zombie villager conversion) on Forge 47.4.x, where Mob#setSpawnCancelled throws UnsupportedOperationException for mobs already added to the world. Redirects the cancellation to discard the entity instead, preserving pre-47.4 behavior.
