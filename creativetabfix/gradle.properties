mod_description=1.20.1-Tec pack fix. GTCA (gtca-1.20.1-2.2.0) registers all of its items/blocks/machines BEFORE setting the Registrate creative tab, so none of them ever land in a creative tab. GTRegistrate.accept only records an entry into its static TAB_LOOKUP when the registrate's currentTab field is already non-null at registration time, and GTCA calls REGISTRATE.creativeModeTab(...) in a static block at the very END of GTCAItems (line 90), GTCABlocks (line 251) and GTCAMachines (line 4601) -- i.e. after every entry in those classes has already been registered. On top of that, GTCA's gtca:main tab is created via GTRegistrate.createCreativeModeTab, which never installs a DisplayItemsGenerator (contrast GTCEu's own tabs, which pass GTCreativeModeTabs.RegistrateDisplayItemsGenerator, and GTSE, which does the same), and GTCA never calls AbstractRegistrate.modifyCreativeModeTab either -- so the tab renders permanently empty. Net effect: gtca: items are in NO creative tab, and JEI's showHiddenIngredients=false (default) hides every item that is not in a creative tab, so they cannot be searched in JEI and cannot be obtained in creative mode without /give. This mod listens for BuildCreativeModeTabContentsEvent and accepts every item of a configured namespace into a configured target tab. Adding is idempotent because the event is backed by MutableHashedLinkedMap<ItemStack, TabVisibility> (a map keyed by ItemStack), so a stock fix for a partially-populated tab is safe. Mapping is configurable via config/creativetabfix-common.toml (namespace=tabId), defaulting to gtca=gtca:main. No mixins and no compile-time dependency on GTCEu -- the fix is purely the documented Forge event, so it cannot drift with GTCEu internals.
