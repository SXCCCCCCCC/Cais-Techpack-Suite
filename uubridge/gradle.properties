mod_description=IU (Industrial Upgrade 3.4.0.10) x IC2 Refabricated UU chain bridge. Part 1: crystal memory bridge (bidirectional, user-ruled 0.1.1) - M1/M2 disk-slot canPlaceItem widening (BlockEntityScanner$1 / BlockEntityPatternStorage$1 m_7013_), M3/M4 getItem() redirects in Scanner.isPatternRecorded/savetoDisk and PatternStorage.updateTileServer so ic2_120:crystal_memory passes the instanceof ItemCrystalMemory gates; writecontentsTag redirected to CrystalMemoryBridge.writePattern which writes BOTH keys in one call - IU "Pattern" (full serialized ItemStack) and IC2 "UuTemplate" ({ItemId: "modid:itemid"}, same structure as UuTemplateData.toNbt) so IC2 machines read their own format natively with zero IC2-side changes; readItemStack redirected to CrystalMemoryBridge.readPattern (Pattern first, falls back to UuTemplate.ItemId -> ItemStack count=1). Part 2: replicator recipe table replacement - TagsUpdatedEvent (LOWEST) clears "replicator" table via Recipes.recipes.removeAll and refills from IC2 Ic2Config.getReplicationCostUb (reflection), matter = uB/1e6 buckets EXACT (user-ruled 0.1.2): ReplicatorRecipe.add(ItemStack, double col) receives costUb / 1000.0 as double (no ceil, no integer truncation) -> putDouble("matter", col/1000) stores exact uB/1e6; IU consumeUu(double) dynamic consumption with extraUuStored change is lossless so no rounding-up needed; 0.1.1 ceil 1-mB floor (10 uB item -> 1 mB, user-verified wrong) and 90,000,000 uB skip (Mek-side tank cap, not applicable to IU) both removed. Two-phase ready refill, ServerStartedEvent reset, JEI clear + initRecipes refresh, IUItem.fluidMatterRecipe snapshot refresh.
