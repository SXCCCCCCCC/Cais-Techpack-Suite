mod_description=IU (Industrial Upgrade 3.4.0.10) x IC2 Refabricated UU chain bridge. Part 1: crystal memory bridge - M1/M2 disk-slot canPlaceItem widening (BlockEntityScanner$1 / BlockEntityPatternStorage$1 m_7013_), M3/M4 getItem() redirects in Scanner.isPatternRecorded/savetoDisk and PatternStorage.updateTileServer so ic2_120:crystal_memory passes the instanceof ItemCrystalMemory gates, writecontentsTag redirected to CrystalMemoryBridge.writePattern (writes IU "Pattern" key, deletes IC2 "UuTemplate" key to prevent zero-cost replication). One-way data: IU machines read/write "Pattern" only. Part 2: replicator recipe table replacement - TagsUpdatedEvent (LOWEST) clears "replicator" table via Recipes.recipes.removeAll and refills from IC2 Ic2Config.getReplicationCostUb (reflection), matter = uB/1e6 buckets, 90,000,000 uB cap (90B), two-phase ready refill, ServerStartedEvent reset, JEI clear + initRecipes refresh, IUItem.fluidMatterRecipe snapshot refresh.
