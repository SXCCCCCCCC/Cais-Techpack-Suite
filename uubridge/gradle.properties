mod_description=IU (Industrial Upgrade 3.4.0.10) x IC2 Refabricated UU chain bridge. Part 1: crystal memory bridge (bidirectional, user-ruled 0.1.1) - M1/M2 disk-slot canPlaceItem widening (BlockEntityScanner$1 / BlockEntityPatternStorage$1 m_7013_), M3/M4 getItem() redirects in Scanner.isPatternRecorded/savetoDisk and PatternStorage.updateTileServer so ic2_120:crystal_memory passes the instanceof ItemCrystalMemory gates; writecontentsTag redirected to CrystalMemoryBridge.writePattern which writes BOTH keys in one call - IU "Pattern" (full serialized ItemStack) and IC2 "UuTemplate" ({ItemId: "modid:itemid"}, same structure as UuTemplateData.toNbt) so IC2 machines read their own format natively with zero IC2-side changes; readItemStack redirected to CrystalMemoryBridge.readPattern (Pattern first, falls back to UuTemplate.ItemId -> ItemStack count=1). 0.1.0 one-way guard (UuTemplate delete on write) removed per user ruling. Part 2: replicator recipe table replacement - TagsUpdatedEvent (LOWEST) clears "replicator" table via Recipes.recipes.removeAll and refills from IC2 Ic2Config.getReplicationCostUb (reflection), matter = uB/1e6 buckets, 90,000,000 uB cap (90B), two-phase ready refill, ServerStartedEvent reset, JEI clear + initRecipes refresh, IUItem.fluidMatterRecipe snapshot refresh.
